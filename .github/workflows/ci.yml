name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install virtualenv
        virtualenv venv
        source venv/bin/activate
        pip install -r lottery_backend/requirements.txt # Assuming you will create this file

    - name: Run Backend Unit Tests
      run: |
        source venv/bin/activate
        cd lottery_backend
        python manage.py test

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Frontend dependencies
      run: |
        cd lottery_frontend
        npm install

    - name: Run Frontend Unit Tests
      run: |
        cd lottery_frontend
        npm test

    - name: Build Frontend
      run: |
        cd lottery_frontend
        npm run build
